[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-illustrator"
version = "0.10.1"
description = "Native command-line control of Adobe Illustrator on macOS (AppleScript/ExtendScript) for editable, publication-ready scientific figures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cli-anything-illustrator contributors" }]
dependencies = ["click>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
windows = ["pywin32>=306; sys_platform == 'win32'"]
fidelity = ["pymupdf>=1.24", "numpy>=1.24", "pillow>=10"]

[project.scripts]
cli-anything-illustrator = "cli_anything.illustrator.cli:main"

[project.urls]
Homepage = "https://github.com/JinxinMonash/cli-anything-illustrator"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli_anything*"]

[tool.setuptools.package-data]
"cli_anything.illustrator" = ["jsx/*.jsx", "jsx/*.applescript"]

[tool.pytest.ini_options]
markers = [
    "illustrator: integration tests requiring a live Adobe Illustrator session on macOS (deselect with '-m \"not illustrator\"')",
]
testpaths = ["tests"]
